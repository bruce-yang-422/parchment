<!DOCTYPE html>
<html lang="zh-TW" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="canonical" href="https://bruce-yang-422.github.io/parchment/">
  <meta name="author" content="Bruce Yang">
  <meta name="theme-color" content="#5b2f18">
  <meta name="application-name" content="Parchment">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Parchment">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:url" content="https://bruce-yang-422.github.io/parchment/">
  <meta property="og:title" content="Parchment｜本機 Markdown 與 TXT 唯讀閱讀器">
  <meta property="og:description" content="在瀏覽器唯讀開啟本機 Markdown（.md）與純文字（.txt），文件留在裝置上。支援檔案拖放、資料夾樹狀瀏覽、文章目錄與離線閱讀。">
  <meta property="og:image" content="https://bruce-yang-422.github.io/parchment/icons/pwa-icon-512x512.png">

  <meta property="og:image:alt" content="Parchment 圖示，含羊皮紙、羽毛筆與鎖頭">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Parchment｜本機 Markdown 與 TXT 唯讀閱讀器">
  <meta name="twitter:description" content="在瀏覽器唯讀開啟本機 Markdown（.md）與純文字（.txt），文件留在裝置上。支援檔案拖放、資料夾樹狀瀏覽、文章目錄與離線閱讀。">
  <meta name="twitter:image" content="https://bruce-yang-422.github.io/parchment/icons/pwa-icon-512x512.png">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Parchment",
      "description": "在瀏覽器唯讀開啟本機 Markdown（.md）與純文字（.txt），文件留在裝置上。支援檔案拖放、資料夾樹狀瀏覽、文章目錄與離線閱讀。",
      "url": "https://bruce-yang-422.github.io/parchment/",
      "image": "https://bruce-yang-422.github.io/parchment/icons/pwa-icon-512x512.png",
      "inLanguage": "zh-TW",
      "applicationCategory": "UtilitiesApplication",
      "browserRequirements": "需要支援 JavaScript 的瀏覽器",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": 0
      }
    }
  </script>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="icons/pwa-icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
  <link id="hljs-light" rel="stylesheet"
    href="assets/vendor/github.min.css">
  <link id="hljs-dark" rel="stylesheet"
    href="assets/vendor/github-dark.min.css"
    disabled>
</head>
<body class="flex flex-col bg-[var(--bg)] font-[family-name:var(--font-sans)] text-[15px] leading-[1.6]
  text-[color:var(--text)] [transition:background_0.2s,color_0.2s]">
  <header id="header" class="sticky top-0 z-[100] flex h-[var(--header-h)] shrink-0 items-center justify-between
    gap-3 bg-[var(--header-bg)] px-4 [border-bottom:1px_solid_var(--header-border)] mobile:px-2.5">
    <div class="mobile:hidden">
      <span class="text-[17px] font-semibold tracking-[-0.3px] text-[color:var(--heading-h1)]">Parchment</span>
    </div>
    <div class="flex items-center gap-2 mobile:w-full mobile:justify-end mobile:gap-1">
      <button id="btn-install-pwa" class="btn-secondary border-[color:var(--link)] text-[color:var(--link)] mobile:px-[9px]"
        type="button" hidden>安裝 App</button>
      <select id="reader-font" aria-label="閱讀字型" title="閱讀字型" class="min-w-0 max-w-28 cursor-pointer rounded-[var(--radius)] border border-solid
        border-[color:var(--btn-secondary-border)] bg-[var(--btn-secondary-bg)] px-2 py-[5px] font-[family-name:var(--font-sans)]
        text-[13px] leading-5 text-[color:var(--btn-secondary-text)] mobile:max-w-[5.5rem] mobile:px-1 mobile:text-[12px]">
        <option value="default">預設字型</option>
        <option value="sans">微軟正黑體</option>
        <option value="serif">新細明體</option>
        <option value="kai">標楷體</option>
      </select>
      <button id="btn-theme" class="btn-icon grid h-8 place-items-center" type="button"
        title="切換主題（目前：跟隨系統）" aria-label="切換主題（目前：跟隨系統）">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <g data-theme-icon="system">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <path d="M8 21h8m-4-4v4"></path>
          </g>
          <g data-theme-icon="light" class="hidden">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </g>
          <g data-theme-icon="dark" class="hidden">
            <path d="M20.99 13.22A9 9 0 0 1 10.78 3.01a9 9 0 1 0 10.21 10.21Z"></path>
          </g>
        </svg>
      </button>
      <button id="btn-open-dir" class="btn-secondary mobile:hidden">開啟資料夾</button>
      <button id="btn-open-file" class="btn-primary">開啟檔案</button>
    </div>
  </header>

  <main id="main" class="single-mode flex h-[calc(100vh_-_var(--header-h))] flex-auto overflow-hidden">
    <aside id="sidebar" class="flex w-[var(--sidebar-w)] shrink-0 flex-col overflow-hidden bg-[var(--sidebar-bg)]
      [border-right:1px_solid_var(--border)]" hidden>
      <div id="tree-header" class="truncate px-3 pb-2 pt-2.5 text-[11px] font-semibold uppercase tracking-[0.5px]
        text-[color:var(--text-muted)] [border-bottom:1px_solid_var(--border)]">
        <span id="tree-root-name"></span>
      </div>
      <div id="tree-container" class="flex-1 overflow-y-auto py-1"></div>
    </aside>

    <section id="content-area" class="relative min-w-0 flex-auto overflow-y-auto">
      <div id="welcome" class="flex h-full min-h-[400px] items-center justify-center
        [background:radial-gradient(circle_at_50%_38%,var(--welcome-glow),transparent_42%)]">
        <div class="w-full min-w-0 max-w-[440px] flex-auto p-8 text-center mobile:p-6">
          <div class="relative mx-auto mb-5 flex size-20 items-center justify-center" aria-label="Parchment">
            <span class="flex size-14 items-center justify-center rounded-[14px] bg-[var(--accent)] text-[28px]
              font-bold text-[color:var(--accent-contrast)]" aria-hidden="true">P</span>
            <img class="welcome-logo-image" src="image/parchment-logo-transparent.png" alt="" width="80" height="80"
              onload="this.previousElementSibling.hidden = true" onerror="this.hidden = true">
          </div>
          <h1 class="mb-2 border-0 p-0 text-[24px] font-semibold">
            Parchment
            <span class="mt-2 block text-[14px] font-normal text-[color:var(--text-muted)]">本機 Markdown 與 TXT 唯讀閱讀器</span>
          </h1>
          <p class="mb-6 text-[13px] text-[color:var(--text-muted)]">開啟檔案或資料夾，或將 .md / .txt 拖放至此</p>
          <div class="welcome-actions flex justify-center gap-2">
            <button id="welcome-btn-dir" class="btn-secondary">開啟資料夾</button>
            <button id="welcome-btn-file" class="btn-primary">開啟檔案</button>
          </div>
          <section id="pwa-install-card" class="pwa-install-card" aria-labelledby="pwa-install-title" hidden>
            <img class="pwa-install-icon" src="icons/pwa-icon-192x192.png" alt="" width="48" height="48">
            <div class="pwa-install-copy">
              <strong id="pwa-install-title">安裝 Parchment App</strong>
              <p id="pwa-install-message">離線開啟，像一般應用程式一樣使用。</p>
            </div>
            <div class="pwa-install-actions">
              <button id="pwa-install-action" class="btn-primary" type="button">安裝 App</button>
              <button id="pwa-install-later" class="btn-secondary" type="button">稍後安裝</button>
              <button id="pwa-install-decline" class="pwa-install-text-button" type="button">不安裝</button>
            </div>
          </section>
          <div id="recent-section" class="mt-6 w-full max-w-[300px] text-left" hidden>
            <div class="mb-3.5 h-px bg-[var(--border)]"></div>
            <p class="mb-1.5 text-[11px] font-semibold uppercase tracking-[0.5px] text-[color:var(--text-muted)]">最近開啟</p>
            <ul id="recent-list" class="m-0 list-none p-0"></ul>
          </div>
        </div>
      </div>

      <article id="reader" class="mx-auto max-w-[860px] px-10 pb-20 mobile:px-5 mobile:pb-[60px]" hidden>
        <div id="reader-header" class="mb-7 flex items-center justify-between gap-3 pb-4 pt-5 [border-bottom:1px_solid_var(--border)]">
          <span id="current-filename" class="font-[family-name:var(--font-mono)] text-[13px] font-medium text-[color:var(--text-muted)]"></span>
          <div class="flex items-center gap-2.5">
            <span id="todo-local-status" title="勾選只儲存在此瀏覽器，不會修改 Markdown 文件" class="whitespace-nowrap rounded-full
              bg-[var(--surface)] px-2 py-px text-[11px] text-[color:var(--text-muted)] [border:1px_solid_var(--border)]" hidden>TODO 本機狀態</span>
            <span id="hot-reload-status" hidden>自動更新</span>
          </div>
        </div>
        <div id="reader-body"></div>
      </article>

      <div id="folder-placeholder" class="flex h-full items-center justify-center text-[14px] text-[color:var(--text-muted)]" hidden>
        <p>從左側選擇檔案以開始閱讀</p>
      </div>
    </section>

    <aside id="toc-sidebar" class="flex w-[238px] shrink-0 flex-col overflow-hidden bg-[var(--sidebar-bg)]
      [border-left:1px_solid_var(--border)] narrow:w-[205px] no-toc:hidden" hidden aria-label="文章目錄">
      <div id="toc-header" class="px-3.5 pb-2 pt-2.5 text-[11px] font-semibold uppercase tracking-[0.5px]
        text-[color:var(--text-muted)] [border-bottom:1px_solid_var(--border)]">文章目錄</div>
      <nav id="toc-container" class="flex-1 overflow-y-auto pb-6 pt-2"></nav>
    </aside>
  </main>

  <div id="drag-overlay" hidden>
    <div class="drag-inner">
      <p class="drag-icon">+</p>
      <p>放開以開啟檔案</p>
      <p class="drag-hint">.md / .txt</p>
    </div>
  </div>

  <div id="image-lightbox" hidden>
    <button id="lightbox-close" class="btn-icon" type="button" aria-label="關閉圖片預覽">關閉</button>
    <img id="lightbox-image" alt="">
  </div>

  <div id="toast-container" class="fixed bottom-5 right-5 z-[300] flex flex-col gap-2"></div>

  <!-- Vendored libraries: no network connection is required at runtime. -->
  <script src="assets/vendor/dompurify.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/vendor/markdown-engine.min.js"></script>
  <script>
    (function () {
      const nativeBtoa = window.btoa.bind(window);
      window.btoa = function patchedBtoa(value) {
        try {
          return nativeBtoa(value);
        } catch (err) {
          if (!(err instanceof DOMException)) throw err;

          const bytes = new TextEncoder().encode(String(value));
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);
          return nativeBtoa(binary);
        }
      };
    })();
  </script>
  <script src="assets/vendor/mermaid.min.js"></script>
  <script src="assets/vendor/graphviz.min.js"></script>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
