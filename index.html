<!DOCTYPE html>
<html lang="zh-TW" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parchment — 本機 Markdown & TXT 閱讀器</title>
  <meta name="description" content="Parchment 是一款純本機的 Markdown 與 TXT 唯讀瀏覽器，無需上傳，隱私優先，支援資料夾樹狀瀏覽與深色模式。">
  <meta name="keywords" content="Markdown reader, TXT reader, local file viewer, offline markdown, 本機閱讀器, Markdown 瀏覽器">
  <meta name="author" content="Bruce Yang">
  <meta name="theme-color" content="#5b2f18">
  <meta name="application-name" content="Parchment">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Parchment">
  <meta property="og:title" content="Parchment — 本機 Markdown & TXT 閱讀器">
  <meta property="og:description" content="純本機的 Markdown 與 TXT 唯讀瀏覽器，無需上傳，隱私優先，支援資料夾樹狀瀏覽與深色模式。">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="icons/pwa-icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
  <link id="hljs-light" rel="stylesheet"
    href="assets/vendor/github.min.css">
  <link id="hljs-dark" rel="stylesheet"
    href="assets/vendor/github-dark.min.css"
    disabled>
</head>
<body>
  <header id="header">
    <div class="header-left">
      <span class="app-name">Parchment</span>
    </div>
    <div class="header-right">
      <button id="btn-install-pwa" class="btn-secondary" hidden>安裝應用程式</button>
      <button id="btn-theme" class="btn-icon" title="切換主題">System</button>
      <button id="btn-open-dir" class="btn-secondary">開啟資料夾</button>
      <button id="btn-open-file" class="btn-primary">開啟檔案</button>
    </div>
  </header>

  <main id="main" class="single-mode">
    <aside id="sidebar" hidden>
      <div id="tree-header">
        <span id="tree-root-name"></span>
      </div>
      <div id="tree-container"></div>
    </aside>

    <section id="content-area">
      <div id="welcome">
        <div class="welcome-inner">
          <div class="welcome-logo">P</div>
          <h1>Parchment</h1>
          <p class="welcome-sub">本機 Markdown &amp; TXT 唯讀瀏覽器</p>
          <p class="welcome-hint">開啟檔案或資料夾，或將 .md / .txt 拖放至此</p>
          <div class="welcome-actions">
            <button id="welcome-btn-dir" class="btn-secondary">開啟資料夾</button>
            <button id="welcome-btn-file" class="btn-primary">開啟檔案</button>
          </div>
          <div id="recent-section" hidden>
            <div class="recent-divider"></div>
            <p class="recent-label">最近開啟</p>
            <ul id="recent-list"></ul>
          </div>
        </div>
      </div>

      <article id="reader" hidden>
        <div id="reader-header">
          <span id="current-filename"></span>
          <span id="hot-reload-status" hidden>自動更新</span>
        </div>
        <div id="reader-body"></div>
      </article>

      <div id="folder-placeholder" hidden>
        <p>從左側選擇檔案以開始閱讀</p>
      </div>
    </section>

    <aside id="toc-sidebar" hidden aria-label="文章目錄">
      <div id="toc-header">文章目錄</div>
      <nav id="toc-container"></nav>
    </aside>
  </main>

  <div id="drag-overlay" hidden>
    <div class="drag-inner">
      <p class="drag-icon">+</p>
      <p>放開以開啟檔案</p>
      <p class="drag-hint">.md / .txt</p>
    </div>
  </div>

  <div id="image-lightbox" hidden>
    <button id="lightbox-close" class="btn-icon" type="button" aria-label="關閉圖片預覽">關閉</button>
    <img id="lightbox-image" alt="">
  </div>

  <div id="toast-container"></div>

  <!-- Vendored libraries: no network connection is required at runtime. -->
  <script src="assets/vendor/dompurify.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/vendor/markdown-engine.min.js"></script>
  <script>
    (function () {
      const nativeBtoa = window.btoa.bind(window);
      window.btoa = function patchedBtoa(value) {
        try {
          return nativeBtoa(value);
        } catch (err) {
          if (!(err instanceof DOMException)) throw err;

          const bytes = new TextEncoder().encode(String(value));
          let binary = '';
          for (const byte of bytes) binary += String.fromCharCode(byte);
          return nativeBtoa(binary);
        }
      };
    })();
  </script>
  <script src="assets/vendor/mermaid.min.js"></script>
  <script src="assets/vendor/graphviz.min.js"></script>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
