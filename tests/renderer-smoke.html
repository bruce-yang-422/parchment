<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/vendor/katex/katex.min.css">
<script src="../assets/vendor/dompurify.min.js"></script>
<script src="../assets/vendor/highlight.min.js"></script>
<script src="../assets/vendor/markdown-engine.min.js"></script>
<script src="../assets/vendor/mermaid.min.js"></script>
<script src="../assets/vendor/graphviz.min.js"></script>
<main id="result"></main>
<script type="module">
  import { setupRenderer, renderMarkdown } from '../assets/js/renderer.js';
  import { taskDocumentKey, wireTaskCheckboxes } from '../assets/js/taskState.js';
  import { initFootnotePreview } from '../assets/js/footnotePreview.js';

  const sample = String.raw`---
status: draft
aliases: [煙霧測試]
---
# Smoke Test

## tags: [住院, 陪病, 清單]

Emoji: :rocket: :+1:

Inline math $E=mc^2$.

$$\int_0^1 x^2 dx$$

Footnote.[^中文] Repeated footnote.[^中文]

[^中文]: <span id="preview-sample">Footnote body.</span> [Read more](https://example.com/)

> [!NOTE]
> Alert body.

> [!faq]- Foldable callout
> Hidden body.

Wiki [[Other note#Section|alias]] and ![[pic.png|200]].

![[Embedded note]]

- [ ] Pending task
- [x] Completed task

~~~mermaid
flowchart LR
  A --> B
~~~

~~~dot
digraph { A -> B }
~~~

<img src=x onerror="document.body.dataset.xss='failed'">`;

  try {
    setupRenderer();
    const result = document.getElementById('result');
    result.innerHTML = renderMarkdown(sample);
    const taskDocument = { name: 'renderer-smoke.md' };
    const taskCount = wireTaskCheckboxes(result, taskDocument);

    const required = ['.katex', '.footnote-item', '.callout[data-callout="note"]', 'details.callout[data-callout="question"]',
      '.metadata-properties', 'a.wiki-link[data-wiki-heading="Section"]', 'img.wiki-embed-image[width="200"]',
      '.note-embed-placeholder', '.mermaid', '.graphviz', '.local-task-checkbox'];
    const missing = required.filter(selector => !result.querySelector(selector));
    const preview = initFootnotePreview(result);
    preview.prepare();
    const [firstRef, repeatedRef] = result.querySelectorAll('.footnote-ref a');
    const renderedNote = result.querySelector('.footnote-item');
    const noteText = renderedNote.querySelector('#preview-sample');
    const noteLink = renderedNote.querySelector('a[href^="https:"]');
    let regularRefClick = false;
    repeatedRef.addEventListener('click', event => {
      regularRefClick = true;
      event.preventDefault();
    });
    repeatedRef.click();
    const dialog = result.querySelector('dialog[open]');
    if (regularRefClick || !dialog?.contains(noteText)
      || result.querySelectorAll('#preview-sample').length !== 1
      || document.activeElement !== dialog.querySelector('.footnote-preview-close')) missing.push('footnote preview');
    dialog?.dispatchEvent(new Event('cancel', { cancelable: true }));
    if (dialog?.isConnected || !renderedNote.contains(noteText)
      || document.activeElement !== repeatedRef) missing.push('footnote Escape focus restoration');
    repeatedRef.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, ctrlKey: true }));
    if (!regularRefClick || result.querySelector('dialog[open]')) missing.push('footnote link fallback');

    let restoredBeforeNavigation = false;
    noteLink.addEventListener('click', event => {
      restoredBeforeNavigation = renderedNote.contains(noteLink) && !result.querySelector('dialog[open]');
      event.preventDefault();
    });
    firstRef.click();
    noteLink.click();
    if (!restoredBeforeNavigation) missing.push('footnote link navigation');
    firstRef.click();
    result.querySelector('.footnote-preview-footer button')?.click();
    if (document.activeElement !== renderedNote) missing.push('footnote endnote navigation');
    renderedNote.querySelectorAll('.footnote-backref')[1]?.click();
    if (document.activeElement !== repeatedRef) missing.push('footnote repeated backlink');

    if (taskCount !== 2) missing.push('interactive task count');
    if (result.querySelector('.local-task-checkbox')?.disabled) missing.push('interactive task disabled');
    const firstTask = result.querySelector('.local-task-checkbox');
    firstTask?.click();
    const savedTasks = JSON.parse(localStorage.getItem(taskDocumentKey(taskDocument)) || '{}');
    if (savedTasks[firstTask?.dataset.taskIdentity] !== true) missing.push('interactive task persistence');
    localStorage.removeItem(taskDocumentKey(taskDocument));
    if (result.innerHTML.includes('onerror=')) missing.push('XSS sanitizer');
    if (result.textContent.includes(':rocket:')) missing.push('emoji');
    const renderedTags = [...result.querySelectorAll('.metadata-tag')].map(tag => tag.textContent);
    if (renderedTags.join(',') !== '#住院,#陪病,#清單') missing.push('tags property');
    if (![...result.querySelectorAll('.metadata-tag')].every(tag => tag.matches('button[type="button"]'))) {
      missing.push('interactive tags property');
    }
    if ([...result.querySelectorAll('h2')].some(heading => heading.textContent.startsWith('tags:'))) {
      missing.push('tags rendered as heading');
    }

    const mermaidSource = result.querySelector('.mermaid').textContent;
    window.mermaid.initialize({ startOnLoad: false });
    const mermaidResult = await window.mermaid.render('smoke-mermaid', mermaidSource);
    if (!mermaidResult.svg.includes('<svg')) missing.push('Mermaid SVG');

    const dotSource = result.querySelector('.graphviz').textContent;
    const viz = await window.ParchmentViz.instance();
    const graphvizSvg = viz.renderSVGElement(dotSource);
    if (graphvizSvg.tagName.toLowerCase() !== 'svg') missing.push('Graphviz SVG');

    document.body.dataset.status = missing.length ? `failed:${missing.join(',')}` : 'passed';
  } catch (error) {
    document.body.dataset.status = `error:${error.message}`;
  }
</script>
