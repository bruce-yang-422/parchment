name: parchment_mobile
description: Parchment mobile reader for Android and iOS.
publish_to: none
version: 1.1.4+4

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.4.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  webview_flutter: ^4.14.1
  flutter_math_fork: ^0.7.4
  highlight: ^0.7.0
  android_file_picker: 2.2.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  crypto: ^3.0.6
  google_fonts: ^9.0.0
  path_provider: ^2.1.6
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/diagram/
    - assets/diagram/vendor/
    - assets/branding/
    - assets/fonts/LICENSES.txt
    - assets/fonts/taipei-sans/OFL.txt
    - assets/fonts/huninn/LICENSE.txt
    - assets/fonts/iansui/OFL.txt
    - assets/fonts/naikai/OFL.txt
    - assets/fonts/genjyuu/OFL.txt
    - assets/fonts/line-seed-jp/OFL.txt
    - assets/fonts/pretendard/OFL.txt

  # Bundled reading fonts (SIL Open Font License 1.1, unmodified). The
  # Google Fonts choices are downloaded when picked; see reader_fonts.dart.
  fonts:
    - family: TaipeiSansTC
      fonts:
        - asset: assets/fonts/taipei-sans/TaipeiSansTCBeta-Regular.ttf
    - family: jfOpenHuninn
      fonts:
        - asset: assets/fonts/huninn/jf-openhuninn-2.1.ttf
    - family: Iansui
      fonts:
        - asset: assets/fonts/iansui/Iansui-Regular.ttf
    - family: NaikaiFont
      fonts:
        - asset: assets/fonts/naikai/NaikaiFont-Regular-Lite.ttf
    - family: GenJyuuGothic
      fonts:
        - asset: assets/fonts/genjyuu/GenJyuuGothic-Regular.ttf
    - family: LINESeedJP
      fonts:
        - asset: assets/fonts/line-seed-jp/LINESeedJP-Regular.otf
    - family: Pretendard
      fonts:
        - asset: assets/fonts/pretendard/Pretendard-Regular.otf

# Launcher icons: python tool/make_icons.py && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/icons/icon-legacy.png
  image_path_ios: tool/icons/icon-ios.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F8F1E7"
  adaptive_icon_foreground: tool/icons/icon-foreground.png
  adaptive_icon_monochrome: tool/icons/icon-monochrome.png
  min_sdk_android: 21
